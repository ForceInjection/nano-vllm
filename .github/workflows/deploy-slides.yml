name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/llm-inference-visual/slides/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: docs/llm-inference-visual/slides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/llm-inference-visual/slides/package-lock.json

      - run: npm ci

      - run: npx slidev build --base /nano-vllm/ --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/llm-inference-visual/slides/dist

      - uses: actions/deploy-pages@v4
